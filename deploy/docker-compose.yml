# Staging/production stack for ONE Linux VM (see deploy/README.md). Secrets come from deploy/.env (made by init-secrets.sh).
name: cs23c02
services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--log-bin=binlog", "--binlog-expire-logs-seconds=604800", "--character-set-server=utf8mb4"]
    volumes: [mysql:/var/lib/mysql]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot --silent"]
      interval: 5s
      retries: 30

  migrate:
    image: cs23c02-api
    build: {context: .., dockerfile: deploy/Dockerfile.api, secrets: [build_ca]}
    user: "0"
    entrypoint: ["sh", "/deploy/migrate.sh"]
    environment: &api_env
      ENV: ${APP_ENV:-prod}
      DATABASE_URL: mysql+pymysql://cs23c02_app:${APP_DB_PASSWORD}@mysql/cs23c02?charset=utf8mb4
      MIGRATION_DATABASE_URL: mysql+pymysql://cs23c02_migrator:${MIGRATOR_PASSWORD}@mysql/cs23c02?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
      CODE_PEPPER: ${CODE_PEPPER}
      AUX_PEPPER: ${AUX_PEPPER}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUST_PROXY_HEADERS: "true"
      CONTENT_DIR: /data/content
      CONTENT_SIGNING_PUBKEY: ${CONTENT_SIGNING_PUBKEY}
      SANDBOX_MODE: http
      SANDBOX_URL: http://sandbox:8090
      SANDBOX_KEY: ${SANDBOX_KEY}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes: ["./migrate.sh:/deploy/migrate.sh:ro"]
    networks: [data]
    depends_on: {mysql: {condition: service_healthy}}
    restart: "no"

  api:
    image: cs23c02-api
    build: {context: .., dockerfile: deploy/Dockerfile.api, secrets: [build_ca]}
    restart: unless-stopped
    environment:
      ENV: ${APP_ENV:-prod}
      DATABASE_URL: mysql+pymysql://cs23c02_app:${APP_DB_PASSWORD}@mysql/cs23c02?charset=utf8mb4
      MIGRATION_DATABASE_URL: mysql+pymysql://cs23c02_migrator:${MIGRATOR_PASSWORD}@mysql/cs23c02?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
      CODE_PEPPER: ${CODE_PEPPER}
      AUX_PEPPER: ${AUX_PEPPER}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUST_PROXY_HEADERS: "true"
      CONTENT_DIR: /data/content
      CONTENT_SIGNING_PUBKEY: ${CONTENT_SIGNING_PUBKEY}
      SANDBOX_MODE: http
      SANDBOX_URL: http://sandbox:8090
      SANDBOX_KEY: ${SANDBOX_KEY}
    volumes: [content:/data/content]
    networks: [data, edge, sandbox]
    depends_on:
      migrate: {condition: service_completed_successfully}
      sandbox: {condition: service_healthy}

  sandbox:
    image: cs23c02-sandbox
    build: {context: .., dockerfile: deploy/Dockerfile.sandbox, secrets: [build_ca]}
    restart: unless-stopped
    environment:
      SANDBOX_KEY: ${SANDBOX_KEY}
    # bubblewrap needs user namespaces and its own /proc inside the container. The container has no route to the internet or to
    # the database (network "sandbox" is internal and holds only api + sandbox). For production, prefer a separate VM (ADR 0006).
    security_opt: ["seccomp=unconfined", "apparmor=unconfined", "systempaths=unconfined"]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    pids_limit: 512
    mem_limit: 2g
    networks: [sandbox]

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      PLAY_URL: ${PLAY_URL:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
      - caddy_data:/data
    networks: [edge]
    depends_on: [api]

  backup:
    image: mysql:8.0.46
    restart: unless-stopped
    entrypoint: ["sh", "/deploy/backup.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ["./backup.sh:/deploy/backup.sh:ro", "${BACKUP_DIR:-./backups}:/backups", "content:/data/content:ro"]
    networks: [data]
    depends_on: {migrate: {condition: service_completed_successfully}}

networks:
  edge: {}              # caddy <-> api
  data: {internal: true}     # api, migrate, backup <-> mysql; no internet
  sandbox: {internal: true}  # api <-> sandbox only; no internet

volumes:
  mysql: {}
  content: {}
  caddy_data: {}

secrets:
  build_ca:
    file: ${BUILD_CA_FILE:-./empty-ca.pem}   # only for builds behind a TLS-intercepting proxy
