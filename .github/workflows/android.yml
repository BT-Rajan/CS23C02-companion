name: android
on:
  push:
    paths: ["android/**", "runtime/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write   # only to publish a short log tail to the ci-logs branch (ADR 0012)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: android } }
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}      # repository variable; empty falls back to the debug placeholder
      API_CERT_PINS: ${{ vars.API_CERT_PINS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Lint, unit tests, debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/gradle.log
      - name: Python runner in headless Chromium (asset-only origin, network blocked, watchdog, fallback)
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund playwright@1.49.1 2>&1 | tail -n 2
          npx playwright install --with-deps chromium 2>&1 | tail -n 2
          node android/runner-test/runner-test.cjs android/app/build/generated/assets/runnerAssets 2>&1 | tee /tmp/runner.log
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 14 }
      - name: Render screens (light, dark, 200% font) for review
        continue-on-error: true
        run: set -o pipefail; gradle --no-daemon --console=plain :app:testDebugUnitTest -Pscreenshots --tests '*ScreenshotTest*' 2>&1 | tail -n 20
      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: screens, path: android/app/build/screens, retention-days: 14, if-no-files-found: ignore }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: reports, path: "android/app/build/reports", retention-days: 7, if-no-files-found: ignore }
      - name: Publish log tail to ci-logs branch
        if: always()
        working-directory: ${{ github.workspace }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          tail -n 150 /tmp/gradle.log > /tmp/tail.log || echo "no log" > /tmp/tail.log
          { echo "run: ${{ github.run_id }}  sha: ${{ github.sha }}  job: ${{ job.status }}"; echo; cat /tmp/tail.log; } > /tmp/android-last.log
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/ci && (git clone --depth 1 --branch ci-logs "$URL" /tmp/ci 2>/dev/null || (mkdir /tmp/ci && cd /tmp/ci && git init -q -b ci-logs && git remote add origin "$URL"))
          cp /tmp/android-last.log /tmp/ci/android-last.log && cd /tmp/ci
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -q -m "android log ${{ github.run_id }}" && git push -q origin ci-logs
