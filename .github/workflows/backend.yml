name: backend
on:
  push:
    paths: ["backend/**", "content-tools/**", "sandbox/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "content-tools/**", "sandbox/**"]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: cs23c02_test }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    defaults: { run: { working-directory: backend } }
    env:
      TEST_ADMIN_URL: mysql+pymysql://root:root@127.0.0.1:3306/
      TEST_APP_USER_HOST: "%"
      DATABASE_URL: mysql+pymysql://app_rt:app_rt_test_pw@127.0.0.1:3306/cs23c02_test?charset=utf8mb4
      MIGRATION_DATABASE_URL: mysql+pymysql://migrator:migrator_test_pw@127.0.0.1:3306/cs23c02_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt bandit pip-audit
      - name: Create database users
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE USER 'migrator'@'%' IDENTIFIED BY 'migrator_test_pw';
            CREATE USER 'app_rt'@'%' IDENTIFIED BY 'app_rt_test_pw';
            GRANT ALL ON cs23c02_test.* TO 'migrator'@'%';"
      - name: Sandbox prerequisites (bubblewrap; Ubuntu 24.04 restricts unprivileged user namespaces by default)
        run: |
          sudo apt-get install -y -q bubblewrap > /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version && test -x /usr/bin/python3.12
      - name: Backend tests (graded runs use the sandbox in-process)
        run: python -m pytest
      - name: Sandbox hostile suite, started as root like production (per-job UIDs)
        working-directory: ${{ github.workspace }}
        run: sudo -E env "PATH=$PATH" "$(command -v python)" -m pytest -q sandbox/tests
      - name: Content tools tests (incl. reference solutions in the sandbox)
        working-directory: ${{ github.workspace }}
        run: python -m pytest -q content-tools
      - name: Static analysis (medium+ severity fails the build)
        run: bandit -q -r app ../sandbox/sandbox -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
